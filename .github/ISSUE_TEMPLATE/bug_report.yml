name: Bug report
description: Report a reproducible Pilot Light problem.
title: "[BUG]: "
labels: ["type: Bug", "state: Pending"]
assignees:
  - hoffstadt
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Attach a small example, screenshots,
        or a capture when useful. Remove private paths and credentials from logs.
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Describe what should happen and what happens instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include exact steps, a minimal code example or scene, and whether it happens every time.
      placeholder: "1. Build with ...\n2. Run ...\n3. ..."
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Pilot Light revision
      description: Commit hash or release tag, plus relevant local changes and API versions.
      placeholder: "git rev-parse HEAD"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Graphics backend
      multiple: true
      options:
        - Not applicable
        - Vulkan
        - Metal
        - CPU
        - Other / custom backend
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Core / extension loading
        - Build / scripts / CI
        - Platform / windows / input
        - Graphics / GPU allocation
        - Renderer / terrain / water / atmosphere
        - UI / drawing / tools
        - Assets / importers / VFS / PAK
        - ECS / transforms / animation / physics
        - Math / standalone libraries
        - Other / unsure
  - type: textarea
    id: environment
    attributes:
      label: Environment and build configuration
      description: OS version, architecture, compiler/SDK, debug/release, C/C++, build command, GPU and driver. For window issues include DPI, monitor count, and windowed/headless mode.
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs, assertions, validation errors or call stack
      description: Paste relevant text. Attach large logs or GPU captures separately.
      render: text
  - type: input
    id: regression
    attributes:
      label: Last known working revision
      description: Optional; include any workaround or configuration that avoids the problem.
