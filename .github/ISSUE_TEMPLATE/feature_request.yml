name: Feature request
description: Propose a capability or API improvement with a concrete use case.
title: "[FEATURE]: "
labels: ["type: Feature", "state: Pending"]
assignees:
  - hoffstadt
body:
  - type: markdown
    attributes:
      value: |
        Please search existing requests first. A small example of the workflow
        you want to enable is more useful than a list of features from another engine.
  - type: textarea
    id: use-case
    attributes:
      label: Problem or use case
      description: What are you trying to build, and what makes it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior or API
      description: Describe the result you want. A short C API sketch or example is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing APIs, application-side workarounds, and their limitations.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      multiple: true
      options:
        - Core / extension loading
        - Build / scripts / CI
        - Platform / windows / input
        - Graphics / GPU allocation
        - Renderer / terrain / water / atmosphere
        - UI / drawing / tools
        - Assets / importers / VFS / PAK
        - ECS / transforms / animation / physics
        - Math / standalone libraries
        - New extension / other
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and compatibility
      description: Relevant backends/platforms, performance or memory budgets, dependencies, API compatibility and asset migration concerns.
  - type: textarea
    id: success
    attributes:
      label: What would demonstrate success?
      description: A small example, measurable behavior, or acceptance criteria. Links and screenshots are welcome.
